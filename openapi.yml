  /captiveportal/access/api:
    get:
      operationId: CaptivePortalAccessApi
      responses:
        '200':
          description: 'RFC 8908: Captive Portal API status object  The URI for this
            endpoint can be provisioned to the client as defined by RFC 7710.  Request
            and response must set media type as "application/captive+json".  Response
            contains the following fields: - captive: boolean: client is currently
            in a state of captivity. - user-portal-url: string: URL to login web portal
            (must be HTTPS). - seconds-remaining: number: seconds until session expires,
            only relevant if hardtimeout set.  Fields not implemented here but possible
            in the future: - venue-info-url: string: Information page (must be HTTPS)
            - can-extend-session: boolean: hint that client system can access user-portal-url
            to extend session. - bytes-remaining: number: no. of bytes after which
            session expires.  Response must set Cache-Control to ''private'' or ''no-store'''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/status'
    description: 'RFC 8908: Captive Portal API status object  The URI for this endpoint
      can be provisioned to the client as defined by RFC 7710.  Request and response
      must set media type as "application/captive+json".  Response contains the following
      fields: - captive: boolean: client is currently in a state of captivity. - user-portal-url:
      string: URL to login web portal (must be HTTPS). - seconds-remaining: number:
      seconds until session expires, only relevant if hardtimeout set.  Fields not
      implemented here but possible in the future: - venue-info-url: string: Information
      page (must be HTTPS) - can-extend-session: boolean: hint that client system
      can access user-portal-url to extend session. - bytes-remaining: number: no.
      of bytes after which session expires.  Response must set Cache-Control to ''private''
      or ''no-store'''
