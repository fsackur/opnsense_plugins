info:
  description: API for managing your OPNsense firewall
  title: OPNsense API
  version: '25.1'
paths:
  /auth/priv/get:
    get:
      operationId: AuthPrivGet
      responses:
        '200':
          description: Retrieve model settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  priv:
                    $ref: '#/components/schemas/opnsense.auth.priv'
    description: Retrieve model settings
  /auth/priv/set:
    post:
      operationId: AuthPrivSet_Post
      responses:
        '200':
          description: Update model settings
          content: &id001
            application/json:
              schema:
                type: object
                properties:
                  priv:
                    $ref: '#/components/schemas/opnsense.auth.priv'
      requestBody:
        required: true
        content: *id001
    description: Update model settings
  /auth/priv/search:
    get:
      operationId: AuthPrivSearch
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/opnsense.auth.priv'
    description: ''
  /auth/priv/getitem/{id}:
    get:
      operationId: AuthPrivGetItem
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/opnsense.auth.priv'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
    description: ''
  /auth/priv/setitem/{id}:
    post:
      operationId: AuthPrivSetItem_Post
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/opnsense.auth.priv'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
    description: ''
openapi: 3.1.0
components:
  schemas:
    status:
      type: object
      properties:
        status:
          type: string
    opnsense.auth.priv:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              Model:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      source:
                        type: string
                      items:
                        type: string
                      display:
                        type: string
                    additionalProperties: false
                additionalProperties: false
            additionalProperties: false
        groups:
          type: array
          items:
            type: object
            properties:
              Model:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      source:
                        type: string
                      items:
                        type: string
                      display:
                        type: string
                    additionalProperties: false
                additionalProperties: false
            additionalProperties: false
      additionalProperties: false
